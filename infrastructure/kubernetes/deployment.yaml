apiVersion: v1
kind: Secret
metadata:
  name: zane-db-credentials
  namespace: zane
type: Opaque
stringData:
  DATABASE_URL: "postgresql://zane:password@postgres-service:5432/zanedb"
  MONGODB_URI: "mongodb://mongodb-service:27017"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zane-api
  namespace: zane
  labels:
    app: zane-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zane-api
  template:
    metadata:
      labels:
        app: zane-api
    spec:
      containers:
        - name: api
          image: zane-drug-discovery:latest
          command: ["uvicorn", "infrastructure.api_gateway:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zane-db-credentials
                  key: DATABASE_URL
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: zane-db-credentials
                  key: MONGODB_URI
            - name: RAY_ADDRESS
              value: "ray://zane-ray-cluster-head-svc:10001"
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zane-worker
  namespace: zane
  labels:
    app: zane-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zane-worker
  template:
    metadata:
      labels:
        app: zane-worker
    spec:
      containers:
        - name: worker
          image: zane-drug-discovery:latest
          command: ["celery", "-A", "infrastructure.api_gateway.celery", "worker", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zane-db-credentials
                  key: DATABASE_URL
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: zane-db-credentials
                  key: MONGODB_URI
            - name: RAY_ADDRESS
              value: "ray://zane-ray-cluster-head-svc:10001"
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: zane-api-service
  namespace: zane
  labels:
    app: zane-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: zane-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zane-api-network-policy
  namespace: zane
spec:
  podSelector:
    matchLabels:
      app: zane-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector: {}
