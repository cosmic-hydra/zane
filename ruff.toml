line-length = 120
target-version = "py310"

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "E701",  # multiple statements on one line (compact class stubs)
  "E702",  # multiple statements on one line (semicolon)
  "N802",  # function name should be lowercase (scientific naming like pK_ode_system)
  "N803",  # argument name casing (common in ML)
  "N806",  # variable name casing (common in ML)
  "N812",  # lowercase imported as non-lowercase
  "N815",  # mixedCase variable in class scope
  "N817",  # CamelCase imported as acronym
  "N818",  # exception name should end with Error
  "S101",  # assert used (fine in tests and non-production code)
  "S108",  # /tmp usage (intentional for temp files)
  "S110",  # try-except-pass (used for optional dependency detection)
  "S112",  # try-except-continue (intentional fallback patterns)
  "S311",  # random.random() not for crypto (used for simulation/dashboard, not security)
  "S603",  # subprocess call with shell=False (intentional)
  "S607",  # partial executable path (intentional for CLI)
  "B008",  # function calls in argument defaults (used by FastAPI/typer)
  "B904",  # raise from in except (too noisy for graceful-degradation patterns)
  "B007",  # loop variable not used (common pattern: for _ in range)
  "B905",  # zip without strict= (intentional for iteration patterns)
  "N801",  # class name CapWords (scientific naming like mRNA)
  "S104",  # binding to all interfaces (intentional for servers)
  "S324",  # sha1 usage (non-cryptographic hashing)
  "E722",  # bare except (used in graceful degradation)
  "RUF001", # ambiguous unicode char in string
  "RUF002", # ambiguous unicode char in docstring/comment
  "RUF003", # ambiguous unicode char in comment
  "RUF012", # mutable class attribute default
  "SIM102", # nested if (readability preference)
  "SIM103", # return condition directly
  "SIM108", # ternary operator (readability preference)
  "SIM115", # context manager for open (existing patterns)
  "SIM117", # multiple with contexts (existing patterns)
]

exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
  "build",
  "dist",
  "external",
  "node_modules",
]

[lint.per-file-ignores]
"tests/**" = ["E402", "S101", "S106"]
"scripts/**" = ["S101", "E402"]
"examples/**" = ["E402", "N999"]
"**/__init__.py" = ["F401"]
"drug_discovery/dashboard.py" = ["S310"]
"drug_discovery/data/feature_store.py" = ["S301"]
"drug_discovery/data/dataset.py" = ["S105"]
"drug_discovery/nanobotics/swarm_logic.py" = ["S307"]
"drug_discovery/web_scraping/scraper.py" = ["S113"]
"drug_discovery/docking/vina_wrapper.py" = ["S605"]
"infrastructure/api_gateway.py" = ["F401"]
"drug_discovery/ai2bmd/ai2bmd_dynamics.py" = ["F401"]
"drug_discovery/generation/torchdrug_generator.py" = ["F401"]
"drug_discovery/toxicity/qm_mm_metabolites.py" = ["F401"]
"drug_discovery/training/active_learning_oracle.py" = ["F401"]
"external/supply_chain.py" = ["F401"]
"tests/test_titan_architecture.py" = ["F401"]

[lint.isort]
known-first-party = ["drug_discovery"]
